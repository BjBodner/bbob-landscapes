<title>BBOB Landscape Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The 24 noiseless bbob functions of the COCO platform in 2-D, as rotating heat maps and elevation maps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=JetBrains+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@1,500&display=swap">
<style>
/* Layout: a one-screen instrument. A slim index of the 24 functions on the left,
   the title block and controls above a rotating landscape stage; on phones the
   index becomes a scrolling strip above the stage. */
:root {
  --bg: #edf1f3;
  --stage: #f8fafb;
  --ink: #13212b;
  --muted: #566874;
  --line: #c3cfd6;
  --chip: #f8fafb;
  --hover: #d8e1e6;
  --accent: #d55e00;
  --tip-bg: #13212b;
  --tip-fg: #edf1f3;
  /* pill categories (Okabe-Ito) */
  --c-mod: #0072b2;
  --c-sep: #009e73;
  --c-loc: #e69f00;
  --c-cond: #56b4e9;
  --c-glob: #cc79a7;
  --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --font-ui: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1318; --stage: #111b22; --ink: #e2e9ed; --muted: #8b9daa; --line: #24343e;
    --chip: #15212a; --hover: #1a2932; --accent: #ff8a3d; --tip-bg: #e2e9ed; --tip-fg: #0c1318;
    --c-mod: #4ea6e0; --c-sep: #2fc39a; --c-loc: #f0b43c; --c-cond: #86cdf2; --c-glob: #e3a1c6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1318; --stage: #111b22; --ink: #e2e9ed; --muted: #8b9daa; --line: #24343e;
  --chip: #15212a; --hover: #1a2932; --accent: #ff8a3d; --tip-bg: #e2e9ed; --tip-fg: #0c1318;
  --c-mod: #4ea6e0; --c-sep: #2fc39a; --c-loc: #f0b43c; --c-cond: #86cdf2; --c-glob: #e3a1c6;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0;
  background: var(--bg); color: var(--ink);
  font: 400 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
sup { font-size: .7em; line-height: 0; vertical-align: .45em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr);
  gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ---- index ---- */
.index {
  min-height: 0; overflow-y: auto;
  padding-block: 18px 16px;
  border-right: 1px solid var(--line);
  padding-right: 12px;
  display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: thin;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding-left: 6px; }
.brand b {
  font: 650 13px/1.2 var(--font-ui); font-stretch: 112%;
  letter-spacing: .14em; text-transform: uppercase;
}
.brand span { font: 400 11.5px/1.3 var(--font-data); color: var(--muted); }
.group { display: flex; flex-direction: column; gap: 1px; }
.group h2 {
  margin: 0 0 4px; padding-left: 6px;
  font: 600 10.5px/1.3 var(--font-ui); font-stretch: 100%;
  letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
  display: flex; gap: 6px;
}
.group h2 .gnum { font-family: var(--font-data); font-weight: 500; letter-spacing: 0; }
.fbtn {
  display: grid; grid-template-columns: 22px 30px minmax(0, 1fr); align-items: center; gap: 8px;
  width: 100%; padding: 4px 6px; border: 0; border-radius: 5px; background: transparent;
  text-align: left; cursor: pointer;
}
.fbtn:hover { background: var(--hover); }
.fbtn[aria-current="true"] { background: var(--ink); color: var(--bg); }
.fbtn canvas { width: 22px; height: 22px; border-radius: 3px; display: block; }
.fbtn .num { font: 500 12px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.fbtn .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- stage ---- */
.main {
  min-width: 0; min-height: 0;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
  gap: 12px; padding-block: 18px 12px;
}
.head { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.eyebrow {
  font: 600 11px/1.3 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
h1 {
  margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px;
  text-wrap: balance;
}
.fsym { font: italic 500 46px/1 var(--font-math); letter-spacing: -.01em; }
.fsym sub { font-size: .52em; font-style: normal; vertical-align: -0.18em; margin-left: .04em; }
.fname { font: 650 30px/1.1 var(--font-ui); font-stretch: 92%; letter-spacing: -.01em; }
.pills { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 3px 10px 3px 8px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--line);
  font-size: 12.5px; line-height: 1.3; white-space: nowrap;
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.desc { margin: 0; max-width: 68ch; color: var(--muted); font-size: 13.5px; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  justify-content: space-between;
}
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.seg {
  display: inline-flex; padding: 2px; border-radius: 7px;
  background: var(--stage); border: 1px solid var(--line);
}
.seg button {
  border: 0; background: transparent; padding: 5px 11px; border-radius: 5px; cursor: pointer;
  font-size: 12.5px; font-weight: 550; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--chip);
  cursor: pointer; font-size: 12.5px; font-weight: 550;
}
.tbtn:hover { background: var(--hover); }
.tbtn svg { width: 12px; height: 12px; fill: currentColor; }
.tbtn[aria-pressed="false"] { color: var(--muted); }
.tbtn .ring { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); }
.tbtn[aria-pressed="false"] .ring { border-color: var(--muted); }

.legend { display: flex; flex-direction: column; gap: 3px; width: 240px; max-width: 100%; }
.legend .lab { font: 500 11px/1.2 var(--font-data); color: var(--muted); }
.legend canvas { width: 100%; height: 9px; border-radius: 2px; display: block; }
.ticks { position: relative; height: 14px; font: 400 10.5px/1 var(--font-data); color: var(--muted); }
.ticks span { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; }
.ticks span::before {
  content: ""; position: absolute; left: 50%; top: -5px; width: 1px; height: 4px; background: var(--muted);
}

.view {
  position: relative; min-height: 0; overflow: hidden;
  background: var(--stage); border-radius: 10px; border: 1px solid var(--line);
}
.view canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.view canvas.gl.dragging { cursor: grabbing; }
.axes { position: absolute; inset: 0; pointer-events: none; }
.axes span {
  position: absolute; transform: translate(-50%, -50%);
  font: 400 11px/1 var(--font-data); color: var(--muted); white-space: nowrap;
}
.axes span.name { font: italic 500 14px/1 var(--font-math); color: var(--ink); }
.tip {
  position: absolute; pointer-events: none; z-index: 2;
  padding: 6px 9px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-fg);
  font: 400 11.5px/1.45 var(--font-data); white-space: nowrap;
  transform: translate(18px, -50%);
}
.notice {
  position: absolute; left: 12px; bottom: 12px; right: 12px;
  font-size: 12px; color: var(--muted);
}
.foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 18px;
  font: 400 11.5px/1.5 var(--font-data); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.foot b { font-weight: 500; color: var(--ink); }
.foot a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 2px; }
.foot a:hover { text-decoration-color: var(--accent); }
kbd {
  font: 500 10.5px/1 var(--font-data); padding: 1px 4px; border-radius: 3px;
  border: 1px solid var(--line); background: var(--chip); color: var(--ink);
}

@media (max-width: 760px) {
  html, body, .app { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .index {
    flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 4px;
    border-right: 0; border-bottom: 1px solid var(--line);
    padding: 12px 0 10px;
  }
  .brand, .group h2, .fbtn .nm { display: none; }
  .group { flex-direction: row; gap: 2px; }
  .group + .group { border-left: 1px solid var(--line); padding-left: 4px; }
  .fbtn { grid-template-columns: 20px auto; gap: 5px; width: auto; padding: 4px 6px; }
  .fbtn canvas { width: 20px; height: 20px; }
  .main { padding-block: 14px 16px; }
  .fsym { font-size: 38px; }
  .fname { font-size: 23px; }
  .view { aspect-ratio: 20 / 21; max-height: 72vh; }
  .legend { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<div class="app">
  <nav class="index" id="index" aria-label="The 24 bbob functions">
    <div class="brand"><b>bbob · 2-D</b><span id="brand-sub">noiseless suite</span></div>
  </nav>

  <main class="main">
    <header class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1><span class="fsym" id="fsym"><i>f</i><sub></sub></span><span class="fname" id="fname"></span></h1>
      <ul class="pills" id="pills" aria-label="Classification"></ul>
      <p class="desc" id="desc"></p>
    </header>

    <div class="bar">
      <div class="controls">
        <div class="seg" role="group" aria-label="View">
          <button type="button" id="v-heat" aria-pressed="false">Heat map</button>
          <button type="button" id="v-elev" aria-pressed="true">Elevation</button>
        </div>
        <div class="seg" role="group" aria-label="Value scale">
          <button type="button" id="s-log" aria-pressed="true">Log</button>
          <button type="button" id="s-lin" aria-pressed="false">Linear</button>
        </div>
        <button type="button" class="tbtn" id="spin" aria-pressed="true">
          <svg viewBox="0 0 12 12" aria-hidden="true" id="spin-icon"><rect x="2" y="1.5" width="2.6" height="9" rx=".6"/><rect x="7.4" y="1.5" width="2.6" height="9" rx=".6"/></svg>
          <span id="spin-label">Pause</span>
        </button>
        <button type="button" class="tbtn" id="opt" aria-pressed="true"><span class="ring" aria-hidden="true"></span>Optimum</button>
      </div>
      <div class="legend" aria-hidden="true">
        <span class="lab" id="legend-lab">f(x) − f<sub>opt</sub>, log scale</span>
        <canvas id="legend" width="480" height="18"></canvas>
        <div class="ticks" id="ticks"></div>
      </div>
    </div>

    <div class="view" id="view">
      <div class="axes" id="axes"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="notice" id="notice" hidden></div>

    <footer class="foot">
      <span id="optline"></span>
      <span id="srcline"></span>
      <span><kbd>↑</kbd> <kbd>↓</kbd> function · <kbd>H</kbd> <kbd>E</kbd> view · <kbd>L</kbd> scale · <kbd>Space</kbd> pause · drag to turn</span>
      <span><a href="https://github.com/BjBodner/bbob-landscapes" target="_blank" rel="noopener">Source code</a> · functions from <a href="https://github.com/numbbo/coco" target="_blank" rel="noopener">COCO</a></span>
    </footer>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";

const DATA = __LANDSCAPES__;

const GROUPS = {
  1: ["Separable", "Separable functions"],
  2: ["Low or moderate conditioning", "Functions with low or moderate conditioning"],
  3: ["High conditioning, unimodal", "Unimodal functions with high conditioning"],
  4: ["Multimodal, adequate structure", "Multimodal functions with adequate global structure"],
  5: ["Multimodal, weak structure", "Multimodal functions with weak global structure"],
};
const CATS = { mod: "Modality", sep: "Separability", loc: "Local surface", cond: "Conditioning", glob: "Global structure" };
const META = [
  { name: "Sphere", group: 1, pills: [["mod", "Unimodal"], ["sep", "Separable"], ["loc", "Smooth"], ["cond", "Conditioning 1"], ["glob", "Isotropic"]],
    text: "The easiest case: a round bowl that looks the same in every direction." },
  { name: "Separable Ellipsoidal", group: 1, pills: [["mod", "Unimodal"], ["sep", "Separable"], ["loc", "Smooth"], ["cond", "Conditioning ≈ 10<sup>6</sup>"]],
    text: "A bowl whose curvature differs a million-fold between the two axes, with small smooth irregularities." },
  { name: "Rastrigin", group: 1, pills: [["mod", "Highly multimodal"], ["sep", "Separable"], ["loc", "Regular local optima"], ["glob", "Adequate global structure"], ["cond", "Conditioning ≈ 10"]],
    text: "An egg-crate: a regular grid of about 10<sup>D</sup> local minima laid over a bowl." },
  { name: "Büche-Rastrigin", group: 1, pills: [["mod", "Highly multimodal"], ["sep", "Separable"], ["loc", "Regular local optima"], ["glob", "Asymmetric"], ["cond", "Conditioning ≈ 10"]],
    text: "Rastrigin with the odd-indexed coordinates skewed, so the egg-crate is lopsided instead of symmetric." },
  { name: "Linear Slope", group: 1, pills: [["mod", "Unimodal"], ["sep", "Separable"], ["loc", "Linear"], ["glob", "Optimum on the boundary"]],
    text: "A tilted plane. The best point lies on the edge of the domain, in the corner the slope runs down to." },
  { name: "Attractive Sector", group: 2, pills: [["mod", "Unimodal"], ["sep", "Non-separable"], ["glob", "Highly asymmetric"], ["cond", "Conditioning ≈ 10"]],
    text: "Only one cone-shaped sector around the optimum slopes gently; outside it the function rises a hundred times more steeply." },
  { name: "Step Ellipsoidal", group: 2, pills: [["mod", "Unimodal"], ["sep", "Non-separable"], ["loc", "Plateaus"], ["cond", "Conditioning ≈ 100"]],
    text: "An ellipsoid rounded into terraces: the gradient is zero almost everywhere except at the step edges." },
  { name: "Rosenbrock, original", group: 2, pills: [["mod", "Unimodal in 2-D"], ["sep", "Non-separable"], ["loc", "Smooth"], ["glob", "Curved valley"]],
    text: "Rosenbrock's banana: a long, curved, nearly flat valley that leads slowly to the minimum." },
  { name: "Rosenbrock, rotated", group: 2, pills: [["mod", "Unimodal in 2-D"], ["sep", "Non-separable"], ["loc", "Smooth"], ["glob", "Curved valley"]],
    text: "The same banana-shaped valley, rotated so that it no longer follows the coordinate axes." },
  { name: "Ellipsoidal", group: 3, pills: [["mod", "Unimodal"], ["sep", "Non-separable"], ["loc", "Smooth"], ["cond", "Conditioning ≈ 10<sup>6</sup>"]],
    text: "The ill-conditioned bowl of f2, rotated, so the stretched direction is no longer an axis." },
  { name: "Discus", group: 3, pills: [["mod", "Unimodal"], ["sep", "Non-separable"], ["loc", "Smooth"], ["cond", "Conditioning ≈ 10<sup>6</sup>"], ["glob", "One sensitive direction"]],
    text: "One direction is a thousand times more sensitive than every other." },
  { name: "Bent Cigar", group: 3, pills: [["mod", "Unimodal"], ["sep", "Non-separable"], ["loc", "Smooth"], ["cond", "Conditioning ≈ 10<sup>6</sup>"], ["glob", "Narrow ridge"]],
    text: "A single long, very narrow valley that has to be followed to the minimum, bent away from a pure quadratic shape." },
  { name: "Sharp Ridge", group: 3, pills: [["mod", "Unimodal"], ["sep", "Non-separable"], ["loc", "Non-smooth"], ["glob", "Sharp ridge"]],
    text: "Like the bent cigar, but the floor of the valley is a sharp crease where the gradient does not point to the optimum." },
  { name: "Different Powers", group: 3, pills: [["mod", "Unimodal"], ["sep", "Non-separable"], ["cond", "Conditioning grows near the optimum"]],
    text: "Each coordinate enters with a different exponent, so the relative sensitivities change as the search closes in." },
  { name: "Rastrigin, rotated", group: 4, pills: [["mod", "Highly multimodal"], ["sep", "Non-separable"], ["loc", "Regular local optima"], ["glob", "Adequate global structure"], ["cond", "Conditioning ≈ 10"]],
    text: "Rastrigin rotated and made irregular, so its lattice of local minima no longer lines up with the axes." },
  { name: "Weierstrass", group: 4, pills: [["mod", "Highly multimodal"], ["sep", "Non-separable"], ["loc", "Rugged"], ["glob", "Repetitive"], ["cond", "Conditioning ≈ 100"]],
    text: "A sum of cosines over many frequencies: rough at every scale, repetitive, with no unique global minimum. The 0.05 grid hides the finest ripples." },
  { name: "Schaffer's F7", group: 4, pills: [["mod", "Highly multimodal"], ["sep", "Non-separable"], ["loc", "Ripples"], ["glob", "Adequate global structure"], ["cond", "Conditioning ≈ 10"]],
    text: "Ripples whose frequency and amplitude change with the distance from the optimum, on an asymmetric base." },
  { name: "Schaffer's F7, ill-conditioned", group: 4, pills: [["mod", "Highly multimodal"], ["sep", "Non-separable"], ["loc", "Ripples"], ["glob", "Adequate global structure"], ["cond", "Conditioning ≈ 1000"]],
    text: "Schaffer's F7 stretched to a conditioning of about 1000." },
  { name: "Composite Griewank-Rosenbrock", group: 4, pills: [["mod", "Highly multimodal"], ["sep", "Non-separable"], ["loc", "Bumpy"], ["glob", "Adequate global structure"]],
    text: "Griewank's ripples on top of Rosenbrock's valley: the large-scale shape is a valley, the small-scale shape is bumpy." },
  { name: "Schwefel x·sin(x)", group: 5, pills: [["mod", "Multimodal"], ["sep", "Non-separable"], ["loc", "Smooth"], ["glob", "Deceptive"], ["glob", "Weak global structure"]],
    text: "Outside a box the function is a steep penalty; inside it, the most prominent 2<sup>D</sup> minima sit near the box corners, far from one another, which misleads local search." },
  { name: "Gallagher's 101 Peaks", group: 5, pills: [["mod", "Multimodal · 101 peaks"], ["sep", "Non-separable"], ["loc", "Smooth basins"], ["glob", "Weak global structure"], ["cond", "Conditioning ≈ 30"]],
    text: "101 Gaussian peaks with random positions and heights: there is no global trend to follow." },
  { name: "Gallagher's 21 Peaks", group: 5, pills: [["mod", "Multimodal · 21 peaks"], ["sep", "Non-separable"], ["loc", "Smooth basins"], ["glob", "Weak global structure"], ["cond", "Conditioning ≈ 1000"]],
    text: "21 sharper, more stretched Gaussian peaks with random positions and heights." },
  { name: "Katsuura", group: 5, pills: [["mod", "Highly multimodal"], ["sep", "Non-separable"], ["loc", "Rugged"], ["glob", "Repetitive"], ["glob", "Weak global structure"]],
    text: "A product of fractal sawtooth terms: rugged at every scale, with more than 10<sup>D</sup> global minima. The 0.05 grid hides the finest structure." },
  { name: "Lunacek bi-Rastrigin", group: 5, pills: [["mod", "Highly multimodal"], ["sep", "Non-separable"], ["glob", "Deceptive funnels"], ["glob", "Weak global structure"], ["cond", "Conditioning ≈ 100"]],
    text: "Two Rastrigin funnels. The decoy funnel covers about 70% of the domain; the global minimum is in the other one." },
];

const N = DATA.grid, LO = DATA.domain[0], HI = DATA.domain[1];
const HEIGHT = 0.8;                 // elevation of the highest point, in half-widths of the square
const LEVELS = 65534;               // quantisation codes 1..65535 (see tools/bbob_landscapes.py)
const TURN_SECONDS = 72;            // one full turn
const TILT_ELEV = 36 * Math.PI / 180, TILT_TOP = 89.6 * Math.PI / 180;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);

/* ---------- data ---------- */
function decode(b64) {
  const s = atob(b64), u = new Uint16Array(s.length >> 1);
  for (let i = 0, k = 0; i < u.length; i++, k += 2) u[i] = s.charCodeAt(k) | (s.charCodeAt(k + 1) << 8);
  return u;
}
const CODES = DATA.functions.map(f => decode(f.data));
const fields = new Map();

/* Heights in [0, 1] for one function and scale, their gradient in mesh units,
   and log10(f - f_opt) per grid point for the readout. */
function field(k, scale) {
  const key = k + scale;
  if (fields.has(key)) return fields.get(key);
  const f = DATA.functions[k], c = CODES[k], n = c.length;
  const step = (f.log_hi - f.log_lo) / LEVELS;
  const logv = new Float32Array(n);
  for (let i = 0; i < n; i++) logv[i] = c[i] ? f.log_lo + (c[i] - 1) * step : -Infinity;
  const h = new Float32Array(n);
  let lo, hi;
  if (scale === "log") {
    const sorted = Uint16Array.from(c).sort();
    let first = 0;
    while (first < n && sorted[first] === 0) first++;
    const q = sorted[Math.min(n - 1, first + Math.floor(0.005 * (n - first)))];
    hi = f.log_hi;
    lo = Math.max(f.log_lo + (q - 1) * step, hi - 8);
    const inv = 1 / (hi - lo);
    for (let i = 0; i < n; i++) h[i] = logv[i] <= lo ? 0 : (logv[i] - lo) * inv;
  } else {
    lo = 0; hi = Math.pow(10, f.log_hi);
    for (let i = 0; i < n; i++) h[i] = c[i] ? Math.pow(10, logv[i] - f.log_hi) : 0;
  }
  const g = new Float32Array(2 * n), cell = 2 / (N - 1);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * N + i;

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  state.zoom = Math.min(2.2, Math.max(0.45, state.zoom * Math.exp(e.deltaY * 0.0012)));
}, { passive: false });

/* the grid point under the pointer, by marching the view ray over the surface */
const raycaster = renderer ? new THREE.Raycaster() : null;
function pick(cx, cy) {
  const r = canvas.getBoundingClientRect();
  const nx = (cx - r.left) / r.width * 2 - 1, ny = -(cy - r.top) / r.height * 2 + 1;
  if (!renderer) {
    const s = Math.min(r.width, r.height) / (2 * 1.5) / state.zoom;
    const px = (cx - r.left - r.width / 2) / s, py = (cy - r.top - r.height / 2) / s;
    const c = Math.cos(state.angle), sn = Math.sin(state.angle);
    return [c * px - sn * py, -(sn * px + c * py)];
  }
  raycaster.setFromCamera({ x: nx, y: ny }, camera);
  const inv = world.matrixWorld.clone().invert();
  const o = raycaster.ray.origin.clone().applyMatrix4(inv);
  const dir = raycaster.ray.direction.clone().transformDirection(inv);
  const top = HEIGHT * value("morph");
  if (top < 1e-3) {
    const t = -o.z / dir.z;
    return t > 0 ? [o.x + t * dir.x, o.y + t * dir.y] : null;
  }
  let t0 = 0, t1 = 50;
  for (const [oc, dc, lo, hi] of [[o.x, dir.x, -1, 1], [o.y, dir.y, -1, 1], [o.z, dir.z, 0, top]]) {
    if (Math.abs(dc) < 1e-12) { if (oc < lo || oc > hi) return null; continue; }
    let a = (lo - oc) / dc, b = (hi - oc) / dc;
    if (a > b) [a, b] = [b, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, b);
  }
  if (t0 > t1) return null;
  const gap = t => o.z + t * dir.z - top * heightAt(o.x + t * dir.x, o.y + t * dir.y);
  const steps = 360;
  let prev = t0;
  if (gap(t0) <= 0) return [o.x + t0 * dir.x, o.y + t0 * dir.y];
  for (let s = 1; s <= steps; s++) {
    const t = t0 + (t1 - t0) * s / steps;
    if (gap(t) <= 0) {
      let a = prev, b = t;
      for (let it = 0; it < 18; it++) { const m = (a + b) / 2; if (gap(m) > 0) a = m; else b = m; }
      return [o.x + b * dir.x, o.y + b * dir.y];
    }
    prev = t;
  }
  return null;
}
function readout(cx, cy) {
  const hit = pick(cx, cy);
  if (!hit || Math.abs(hit[0]) > 1 || Math.abs(hit[1]) > 1) { tip.hidden = true; return; }
  const i = Math.round((hit[0] + 1) / 2 * (N - 1)), j = Math.round((hit[1] + 1) / 2 * (N - 1));
  const x1 = LO + (HI - LO) * i / (N - 1), x2 = LO + (HI - LO) * j / (N - 1);
  const f = DATA.functions[state.k], lv = current.logv[j * N + i];
  const delta = lv === -Infinity ? 0 : Math.pow(10, lv);
  const places = delta > 0 ? Math.min(6, Math.max(0, 2 - Math.floor(Math.log10(delta)))) : 2;
  const fx = delta >= 1e5 ? num(f.f_opt + delta) : neg((f.f_opt + delta).toFixed(places));
  tip.innerHTML = `x = (${coord(x1)}, ${coord(x2)})<br>f − f<sub>opt</sub> = ${num(delta)}<br>f = ${fx}`;
  const r = view.getBoundingClientRect();
  tip.style.left = `${Math.min(cx - r.left, r.width - 190)}px`;
  tip.style.top = `${cy - r.top}px`;
  tip.hidden = false;
}

/* ---------- controls ---------- */
$("v-heat").addEventListener("click", () => setView("heat"));
$("v-elev").addEventListener("click", () => setView("elevation"));
$("s-log").addEventListener("click", () => setScale("log"));
$("s-lin").addEventListener("click", () => setScale("linear"));
$("spin").addEventListener("click", () => setSpin(!state.spin));
$("opt").addEventListener("click", () => setOpt(!state.opt));
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === "arrowdown" || k === "arrowright" || k === "j") { e.preventDefault(); select((state.k + 1) % 24); buttons[state.k].focus({ preventScroll: true }); }
  else if (k === "arrowup" || k === "arrowleft" || k === "k") { e.preventDefault(); select((state.k + 23) % 24); buttons[state.k].focus({ preventScroll: true }); }
  else if (k === "h") setView("heat");
  else if (k === "e") setView("elevation");
  else if (k === "l") setScale(state.scale === "log" ? "linear" : "log");
  else if (k === " " && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); setSpin(!state.spin); }
});

/* ---------- loop ---------- */
let last = now(), size = [0, 0];
function frameLoop() {
  const t = now(), dt = Math.min(0.1, (t - last) / 1000);
  last = t;
  if (state.spin && !drag) state.angle += dt * 2 * Math.PI / TURN_SECONDS;
  const w = view.clientWidth, h = view.clientHeight;
  if (renderer) {
    if (w !== size[0] || h !== size[1]) { renderer.setSize(w, h, false); size = [w, h]; }
    const morph = value("morph");
    uniforms.uMorph.value = morph;
    uniforms.uMix.value = value("mix");
    uniforms.uContour.value = 0.62 - 0.24 * morph;
    world.rotation.z = state.angle;
    placeCamera(w || 1, h || 1);
    if (pin.visible) {
      const zs = HEIGHT * morph * heightAt(pin.position.x, pin.position.y);
      const ztop = zs + (HEIGHT * morph + 0.12 - zs) * morph;
      ring.position.z = zs + 0.004;
      head.position.z = ztop;
      head.visible = morph > 0.05;
      const sp = pin.userData.stem.geometry.attributes.position;
      sp.setXYZ(0, 0, 0, zs); sp.setXYZ(1, 0, 0, ztop); sp.needsUpdate = true;
    }
    world.updateMatrixWorld();
    renderer.render(scene, camera);
    const v = new THREE.Vector3();
    for (const L of LABELS) {
      v.set(L.x, L.y, 0).applyMatrix4(world.matrixWorld).project(camera);
      L.el.style.left = `${(v.x + 1) / 2 * w}px`;
      L.el.style.top = `${(1 - v.y) / 2 * h}px`;
      L.el.hidden = v.z > 1;
    }
  } else {
    draw2d(w, h, Math.min(window.devicePixelRatio || 1, 2));
  }
  requestAnimationFrame(frameLoop);
}

/* ---------- start ---------- */
function hashed() {   // #f1 .. #f24 links to one function
  const m = /^#f(\d{1,2})$/.exec(location.hash || "");
  return m && +m[1] >= 1 && +m[1] <= 24 ? +m[1] - 1 : null;
}
const startK = hashed() ?? 0;
addEventListener("hashchange", () => { const k = hashed(); if (k !== null && k !== state.k) select(k); });
setSpin(state.spin);
if (state.view === "heat") {
  $("v-heat").setAttribute("aria-pressed", "true"); $("v-elev").setAttribute("aria-pressed", "false");
  anims.morph = { from: 0, to: 0, t0: 0, ms: 0 };
  anims.tilt = { from: TILT_TOP, to: TILT_TOP, t0: 0, ms: 0 };
}
select(startK, { blend: false, scroll: false });
$("srcline").textContent = `${DATA.grid} × ${DATA.grid} grid on [−5, 5]² · bbob instance ${DATA.instance} · ${DATA.source}`;
requestAnimationFrame(frameLoop);
const pending = META.map((_, k) => k);
(function thumbs() {
  const t = now();
  while (pending.length && now() - t < 12) thumbnail(pending.shift());
  if (pending.length) setTimeout(thumbs, 0);
})();
})();
</script>
